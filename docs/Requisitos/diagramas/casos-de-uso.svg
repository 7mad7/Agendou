<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 650" width="1240" height="650" font-family="Arial, 'Liberation Sans', sans-serif">
  <title>Diagrama de casos de uso do Agendou</title>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10" fill="none" stroke="#333" stroke-width="1.5"/>
    </marker>
    <marker id="heranca" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M0 0 L12 6 L0 12 Z" fill="#fff" stroke="#333" stroke-width="1.2"/>
    </marker>
    <g id="ator" stroke="#333" stroke-width="2.4" fill="none">
      <circle cx="0" cy="-38" r="11"/>
      <line x1="0" y1="-27" x2="0" y2="8"/>
      <line x1="-20" y1="-14" x2="20" y2="-14"/>
      <line x1="0" y1="8" x2="-17" y2="38"/>
      <line x1="0" y1="8" x2="17" y2="38"/>
    </g>
  </defs>

  <!-- Fronteira do sistema -->
  <rect x="200" y="30" width="860" height="590" rx="18" fill="#fff" stroke="#333" stroke-width="1.6"/>
  <text x="630" y="62" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">Sistema Agendou</text>

  <!-- Associações (desenhadas antes dos casos de uso) -->
  <g stroke="#444" stroke-width="1.6">
    <line x1="125" y1="185" x2="243" y2="110"/>
    <line x1="125" y1="190" x2="240" y2="185"/>
    <line x1="125" y1="196" x2="240" y2="260"/>
    <line x1="125" y1="202" x2="245" y2="335"/>
    <line x1="125" y1="478" x2="242" y2="430"/>
    <line x1="125" y1="486" x2="542" y2="545"/>
    <line x1="1125" y1="330" x2="1030" y2="150"/>
    <line x1="1125" y1="333" x2="1030" y2="230"/>
    <line x1="1125" y1="336" x2="1030" y2="310"/>
    <line x1="1125" y1="345" x2="738" y2="545"/>
    <line x1="1125" y1="112" x2="1027" y2="143"/>
  </g>

  <!-- Generalização Cliente → Visitante -->
  <line x1="100" y1="425" x2="100" y2="262" stroke="#333" stroke-width="1.6" marker-end="url(#heranca)"/>

  <!-- «include» -->
  <line x1="390" y1="397" x2="390" y2="370" stroke="#333" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#seta)"/>
  <text x="400" y="389" font-size="13" fill="#333">«include»</text>

  <!-- Casos de uso -->
  <g font-size="15" fill="#1d2b44" text-anchor="middle">
    <g>
      <ellipse cx="390" cy="110" rx="150" ry="31" fill="#F2F6FC" stroke="#2F5597" stroke-width="1.6"/>
      <text x="390" y="104" font-weight="bold">UC01</text><text x="390" y="123">Cadastrar conta</text>
    </g>
    <g>
      <ellipse cx="390" cy="185" rx="150" ry="31" fill="#F2F6FC" stroke="#2F5597" stroke-width="1.6"/>
      <text x="390" y="179" font-weight="bold">UC03</text><text x="390" y="198">Recuperar senha</text>
    </g>
    <g>
      <ellipse cx="390" cy="260" rx="150" ry="31" fill="#F2F6FC" stroke="#2F5597" stroke-width="1.6"/>
      <text x="390" y="254" font-weight="bold">UC07</text><text x="390" y="273">Buscar comércios</text>
    </g>
    <g>
      <ellipse cx="390" cy="335" rx="150" ry="31" fill="#F2F6FC" stroke="#2F5597" stroke-width="1.6"/>
      <text x="390" y="329" font-weight="bold">UC08</text><text x="390" y="348">Consultar horários livres</text>
    </g>
    <g>
      <ellipse cx="390" cy="430" rx="150" ry="31" fill="#F2F6FC" stroke="#2F5597" stroke-width="1.6"/>
      <text x="390" y="424" font-weight="bold">UC09</text><text x="390" y="443">Agendar serviço</text>
    </g>
    <g>
      <ellipse cx="640" cy="545" rx="100" ry="31" fill="#F2F6FC" stroke="#2F5597" stroke-width="1.6"/>
      <text x="640" y="539" font-weight="bold">UC02</text><text x="640" y="558">Autenticar-se</text>
    </g>
    <g>
      <ellipse cx="880" cy="150" rx="150" ry="31" fill="#F2F6FC" stroke="#2F5597" stroke-width="1.6"/>
      <text x="880" y="144" font-weight="bold">UC04</text><text x="880" y="163">Manter perfil do comércio</text>
    </g>
    <g>
      <ellipse cx="880" cy="230" rx="150" ry="31" fill="#F2F6FC" stroke="#2F5597" stroke-width="1.6"/>
      <text x="880" y="224" font-weight="bold">UC05</text><text x="880" y="243">Manter catálogo de serviços</text>
    </g>
    <g>
      <ellipse cx="880" cy="310" rx="150" ry="31" fill="#F2F6FC" stroke="#2F5597" stroke-width="1.6"/>
      <text x="880" y="304" font-weight="bold">UC06</text><text x="880" y="323">Configurar disponibilidade</text>
    </g>
  </g>

  <!-- Atores -->
  <g font-size="15" fill="#222" text-anchor="middle">
    <use href="#ator" x="100" y="190"/><text x="100" y="250">Visitante</text>
    <use href="#ator" x="100" y="478"/><text x="100" y="538">Cliente</text>
    <use href="#ator" x="1150" y="338"/><text x="1150" y="398">Comerciante</text>
    <use href="#ator" x="1150" y="108"/><text x="1150" y="168">Geocodificação</text><text x="1150" y="186" font-size="13" fill="#555">(OpenStreetMap)</text>
  </g>
</svg>
